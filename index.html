// Reemplaza el almacenamiento persistente del artefacto por localStorage del navegador.
// Los datos quedan guardados en ESTE navegador/dispositivo (no se sincronizan entre dispositivos).
(function () {
  const PREFIX = "agenda_hotel_copahue::";

  window.storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value, shared: false };
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      try {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true, shared: false };
      } catch (e) {
        return null;
      }
    },
    async list(prefix) {
      try {
        const p = PREFIX + (prefix || "");
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(PREFIX.length));
        }
        return { keys, prefix, shared: false };
      } catch (e) {
        return null;
      }
    },
  };
})();
